<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account settings - Brightwave Mobile</title>
  <style>
    body { font: 16px/1.5 sans-serif; color: #222; background: #fff; margin: 2rem; }
    [role="switch"] { padding: .3rem .8rem; border: 2px solid #444; border-radius: 1rem; background: #fff; }
    [role="switch"][aria-checked="true"] { background: #146; color: #fff; }
    table { border-collapse: collapse; } th, td { padding: .2rem 1rem .2rem 0; border-bottom: 1px solid #ccc; text-align: left; }
  </style>
</head>
<body>
  <header><nav aria-label="Main"><a href="#plan">Plan</a> <a href="#bills">Bills</a></nav></header>
  <main>
    <h1>Account settings</h1>
    <h2>Alerts</h2>
    <p><button type="button" role="switch" aria-checked="false" id="alerts">Email alerts</button></p>
    <h2>Data use</h2>
    <table>
      <caption>Data used per month</caption>
      <tr><th scope="col">Month</th><th scope="col">Data used</th></tr>
      <tr><td>August</td><td>4.2 GB</td></tr>
      <tr><td>September</td><td>6.8 GB</td></tr>
    </table>
    <h2>Limits</h2>
    <form action="#saved">
      <p><label for="v1">Warn me at (GB)</label><br><input id="v1" name="v1" type="number" value="10"></p>
      <p><label for="v2">Monthly spending cap (GBP)</label><br><input id="v2" name="v2" type="number" value="80"></p>
      <button type="submit">Save</button>
    </form>
  </main>
  <script>
    const s = document.getElementById('alerts');
    s.addEventListener('click', () => s.setAttribute('aria-checked', String(s.getAttribute('aria-checked') !== 'true')));
  </script>
</body>
</html>
