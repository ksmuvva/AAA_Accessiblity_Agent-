name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -c constraints.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -W error -c "import agent_access.team"
      - run: python -m agent_access.catalogue.sync --check
      - run: python -m pytest
      # The automated checks alone on the eval cases: no model, no key, no cost. It must stay scorable (exit 3 if not).
      - run: python -m evals.run_eval --mode baseline --memory off
