<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Input methods test page</title>
<style>.box { width: 160px; height: 48px; margin: 8px 0; background: #036; color: #fff; padding: 4px; }</style></head>
<body>
<main>
  <h1>Input methods</h1>
  <!-- 2.5.2: acts on mouse-down, before release -->
  <div id="press" class="box">Press to open</div>
  <p id="pressed" hidden>Opened on mouse-down</p>
  <!-- 2.5.1: path-based gesture handler on an element -->
  <div id="swipe" class="box">Swipe the gallery</div>
  <!-- 2.5.6: handles touch only, no mouse/pointer handler -->
  <div id="tap" class="box">Tap only</div>
  <!-- 2.5.7: drag to reorder, no other way -->
  <div id="drag" class="box" draggable="true">Drag me to reorder</div>
  <!-- 2.1.4: single-key shortcut on the document -->
  <p id="searchbox" hidden>Search opened by the S key</p>
</main>
<script>
  document.getElementById('press').addEventListener('mousedown', () => { document.getElementById('pressed').hidden = false; });
  document.getElementById('swipe').addEventListener('touchmove', () => {});
  document.getElementById('tap').addEventListener('touchstart', () => {});
  document.addEventListener('keydown', (e) => { if (e.key === 's') document.getElementById('searchbox').hidden = false; });
  // 2.5.4: device motion
  window.addEventListener('devicemotion', () => {});
</script>
</body>
</html>
