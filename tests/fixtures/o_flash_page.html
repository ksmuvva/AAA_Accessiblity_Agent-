<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Flashing banner test page</title>
<style>
  #flash { width: 100vw; height: 100vh; background: #000; }
  #flash.on { background: #fff; }
</style></head>
<body style="margin:0">
<main><h1 style="position:absolute;color:#888;margin:8px">Flashing banner</h1><div id="flash"></div></main>
<script>
  // 2.3.1 / 2.3.2: the whole viewport alternates black and white every 80 ms (about 6 flashes a second).
  setInterval(() => document.getElementById('flash').classList.toggle('on'), 80);
</script>
</body>
</html>
