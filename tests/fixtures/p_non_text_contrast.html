<!doctype html>
<html lang="en">
  <head>
    <title>Search - Example</title>
    <style>
      body { background: #ffffff; font: 16px sans-serif; }
      #q { border: 1px solid #e0e0e0; background: #ffffff; padding: 8px; }
      #strong { border: 2px solid #444444; background: #ffffff; padding: 8px; }
      button { background: #ffffff; border: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Search</h1>
      <!-- A text field whose only boundary is a 1.3:1 border on white. -->
      <label for="q">Search terms</label>
      <input id="q" type="text">
      <!-- A field with a clear boundary: must not be flagged. -->
      <label for="strong">Postcode</label>
      <input id="strong" type="text">
      <!-- An icon-only button whose icon is light grey on white. -->
      <button id="go" aria-label="Search">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="#cccccc"/></svg>
      </button>
    </main>
  </body>
</html>
