<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in and pay - fixture with form defects</title>
  <style>
    body { font-family: sans-serif; color: #222; background: #fff; }
    label { display: block; margin-top: 12px; }
    input, select { min-width: 240px; min-height: 32px; }
    button { min-width: 120px; min-height: 32px; }
    .error { color: #b00020; margin-top: 8px; }
    .captcha { width: 300px; height: 70px; border: 2px solid #999; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <!-- 3.3.8 / 3.3.9: pasting is blocked, no autocomplete token, and a CAPTCHA with no alternative. -->
    <form id="login" action="http://localhost/login" method="post" novalidate>
      <label for="user">Username</label>
      <input id="user" name="user" type="text" required>
      <label for="pw">Password</label>
      <input id="pw" name="pw" type="password" required onpaste="return false">
      <div class="g-recaptcha captcha" aria-label="CAPTCHA: type the letters shown"></div>
      <button type="submit">Sign in</button>
      <!-- 4.1.3: the error appears in a plain div, no live region, and focus stays on the button. -->
      <div id="login-error" class="error" hidden></div>
    </form>

    <h1>Pay</h1>
    <form id="pay" action="http://localhost/pay" method="post" novalidate>
      <label for="card">Card number</label>
      <input id="card" name="card" type="text" inputmode="numeric" required>
      <label for="country">Country</label>
      <!-- 3.2.2: changing the select navigates without a submit. -->
      <select id="country" name="country" onchange="window.location.assign('http://localhost/pay?country=' + this.value)">
        <option value="">Choose a country</option>
        <option value="gb">United Kingdom</option>
        <option value="ie">Ireland</option>
      </select>
      <button type="submit">Pay now</button>
      <div id="pay-error" class="error" hidden></div>
    </form>
  </main>
  <script>
    for (const id of ['login', 'pay']) {
      const form = document.getElementById(id);
      form.addEventListener('submit', (event) => {
        if (form.checkValidity()) return;
        event.preventDefault();
        const box = document.getElementById(id + '-error');
        box.textContent = 'Please fill in every required field.';
        box.hidden = false;
      });
    }
  </script>
</body>
</html>
