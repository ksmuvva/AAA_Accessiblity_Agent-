<!doctype html>
<html lang="en">
  <head><title>Gallery - Example</title></head>
  <body>
    <main>
      <h1>Gallery</h1>
      <!-- Generic alt text that says nothing about the image. -->
      <img id="generic" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="120" height="80" alt="image">
      <img id="logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="120" height="80" alt="logo">
      <!-- A whole paragraph in the alt attribute. -->
      <img id="long" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="120" height="80"
           alt="This photograph was taken on a bright summer afternoon in the old harbour, where fishing boats painted in red, blue and green are moored along the stone quay while gulls circle overhead and visitors sit at the cafe tables.">
      <!-- A good one. -->
      <img id="ok" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="120" height="80" alt="A red bicycle leaning against a brick wall">
    </main>
  </body>
</html>
