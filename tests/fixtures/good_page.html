<!doctype html>
<html lang="en">
  <head>
    <title>Contact us - Example Shop</title>
    <style>
      body { font: 16px/1.5 sans-serif; max-width: 100%; margin: 1rem; }
      button, input { min-height: 44px; min-width: 44px; font-size: 1rem; }
      a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      img { max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <a href="#main">Skip to main content</a>
    <header><nav aria-label="Main"><a href="/">Home</a> <a href="/products">Products</a></nav></header>
    <main id="main">
      <h1>Contact us</h1>
      <p>Send us a message and we will reply within two working days.</p>
      <form>
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email">
        <button type="submit">Send message</button>
      </form>
    </main>
    <footer><p>Example Shop</p></footer>
  </body>
</html>
